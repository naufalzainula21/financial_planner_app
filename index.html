<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rencana · Budget Tracker</title>
  <meta name="description" content="Track spending, plan budgets and grow savings goals.">
  <meta name="theme-color" content="#F7F7FB">

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rencana">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="appbar" id="appbar"></header>

    <main class="content" id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span>
      </a>
      <a href="#/activity" data-tab="activity">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg><span>Transactions</span>
      </a>
      <button class="tab-add" type="button" data-action="open-tx" aria-label="Add transaction">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a href="#/stats" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V11"/><path d="M12 20V4"/><path d="M18 20v-6"/></svg><span>Stats</span>
      </a>
      <a href="#/plan" data-tab="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 14.5h2"/></svg><span>Plan</span>
      </a>
    </nav>

    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript>Rencana needs JavaScript turned on.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
